const places=['โลหะปราสาท','เสาชิงช้า','ย่านเมืองเก่า','ริมแม่น้ำเจ้าพระยา','วัดอรุณราชวราราม'];const times=['09:00 – 09:40','09:50 – 10:20','10:30 – 11:10','11:20 – 11:50','12:00 – 13:00'];

const $=s=>document.querySelector(s);const img=(key,alt='',cls='')=>`<img src="${A[key]}" alt="${alt}" class="${cls}">`;const save=()=>{try{localStorage.setItem('kaeroi-demo',JSON.stringify(state))}catch{}};
function toast(t){$('#live').innerHTML='';const el=document.createElement('div');el.className='toast';el.textContent=t;$('#live').append(el);setTimeout(()=>el.remove(),3000)}
function go(p){page=p;render();window.scrollTo(0,0)}
function title(t,back='home'){return `<div class="page-title"><button class="back" onclick="go('${back}')" aria-label="ย้อนกลับ">‹</button><h1>${t}</h1></div>`}
function packCard(p,i,wide=false){return `<article class="${wide?'panel wide-package':'package'}" style="--tone:${p.tone};--tint:${p.tint}">${img(p.img,p.name)}<div><h3>${p.name}</h3><p>${p.desc}</p><div class="price">฿${p.price} <small>/แพ็กเกจ</small></div><ul class="features">${p.features.map(f=>`<li>${f}</li>`).join('')}</ul><button class="choose" onclick="picked=${i};go('checkout')">เลือกแพ็กเกจนี้ →</button></div></article>`}
function seriesCard(s,i){return `<button class="series-card" onclick="series=${i};go('detail')"><div class="poster">${img(s.img,s.name)}<strong>${s.name}</strong></div><small>♧ ${s.count} สถานที่ในพระนคร　♧</small></button>`}
function steps(n){return `<div class="steps">${['เลือกซีรีส์','ตั้งค่าทริป','ตรวจสอบและยืนยัน'].map((x,i)=>`<div class="step ${i<=n?'current':''}"><b>${i<n?'✓':i+1}</b>${x}</div>`).join('')}</div>`}
function timeline(){return `<div class="panel timeline">${places.map((p,i)=>`<div class="stop"><b class="number">${i+1}</b>${img('place'+i,p)}<div><small>${times[i]}</small><h3>${p}</h3><small class="muted">♧ จาก ${i<2?'SHINE':'The White Lotus'}</small></div></div>`).join('')}</div>`}
function miniPack(){let p=packs[picked];return `<div class="panel row">${img(p.img,p.name)}<div><span class="badge">แพ็กเกจของคุณ</span><h3>${p.name}</h3><small>${p.desc}</small></div><div class="price">฿${p.price}</div></div>`}
function render(){let h='';
