<!DOCTYPE html>
<!-- #คู่มืออ่านไฟล์
  ไฟล์นี้แยกโค้ดแต่ละหน้าเป็นฟังก์ชัน เรียงหน้าหลักไปจนถึงเกี่ยวกับแอพ พร้อมคำอธิบายภาษาไทย ไม่ต้อง build
  เปิดด้วยเบราว์เซอร์เพื่อใช้งาน หรือเปิดด้วยโปรแกรมแก้โค้ดเพื่ออ่านคอมเมนต์
  ใช้ค้นหา (Ctrl+F / Cmd+F): #หน้าหลัก, #หน้ารวมคูปอง, #คลังรูปภาพรวม, [จุดใส่รูปภาพ]

  ส่วนที่ 1: head และ CSS กำหนดหน้าตา
  ส่วนที่ 2: body เป็นโครงร่วม (หัวแอพ พื้นที่หน้า เมนูล่าง ข้อความแจ้งเตือน)
  ส่วนที่ 3: JavaScript มีข้อมูล รูป ฟังก์ชัน และโค้ดแต่ละหน้า
  รูปที่ฝังอยู่ใน A ใช้ data URL แบบ Base64; เป็นข้อมูลรูป ไม่ใช่โค้ดที่ต้องอ่านทีละตัว

  ชนิดคอมเมนต์: HTML ใช้เครื่องหมายเปิด/ปิดคอมเมนต์แบบในกล่องนี้
  CSS และ JavaScript ใช้ /* คำอธิบาย */; JavaScript ใช้ // คำอธิบาย ได้อีกแบบ
  เครื่องหมาย # ใช้ในชื่อหัวข้อภายในคอมเมนต์ เพื่อค้นหาให้ง่าย ไม่ใช่คำสั่งของแอพ
  คอมเมนต์จะเห็นในไฟล์โค้ด แต่ไม่แสดงบนหน้าจอแอพ
-->
<html lang="th">
<head>
  <!-- ใช้ UTF-8 เพื่อแสดงภาษาไทยและอีโมจิได้ถูกต้อง -->
  <meta charset="UTF-8">
  <!-- ให้ความกว้างหน้าเว็บตรงกับจอมือถือ และเริ่มที่ขนาดปกติ -->
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- ชื่อที่เห็นบนแท็บของเบราว์เซอร์ -->
  <title>แกะรอย — Phra Nakhon Scene Quest</title>
  <!-- #CSS_กำหนดหน้าตา
    selector เช่น .panel เลือกแท็กที่มี class="panel" ส่วน #main เลือกแท็ก id="main"
    ค่าขนาด px = พิกเซล, % = สัดส่วนจากกล่องแม่, dvh = สัดส่วนความสูงหน้าจอ
    ค่าหลังเครื่องหมาย : เป็นค่าที่ปรับได้; คำอธิบายอยู่ท้ายแต่ละบรรทัด
  -->
<style>
/* #ตัวแปรสีหลักของทั้งแอพ */
:root {
  --purple: #803bff; /* ตัวแปรสีม่วงหลัก เรียกใช้ด้วย var(--purple) */
  --ink: #20134d; /* ตัวแปรสีข้อความหลัก */
  --muted: #817895; /* ตัวแปรสีข้อความรอง */
  --line: #eee7fa; /* ตัวแปรสีเส้นขอบ */
  --soft: #f5efff; /* ตัวแปรสีพื้นอ่อน */
}

/* ใช้กับทุกแท็ก เพื่อนับขนาดกล่องให้สม่ำเสมอ */
* {
  box-sizing: border-box; /* border-box ให้นับ padding และ border รวมในความกว้าง/สูง */
}

/* พื้นหน้าเว็บและฟอนต์เริ่มต้น */
body {
  margin: 0; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
  font-family: Tahoma,Arial,sans-serif; /* ลำดับฟอนต์ที่ให้เบราว์เซอร์เลือกใช้ */
  color: var(--ink); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  background: #eeeaf5; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  font-size: 14px; /* ขนาดตัวอักษร */
  line-height: 1.6; /* ความสูงบรรทัด; ค่าที่ไม่มีหน่วยเป็นตัวคูณขนาดฟอนต์ */
}

/* รูปแบบข้อความหรือองค์ประกอบพื้นฐาน */
button,input,select {
  font: inherit; /* inherit ให้ใช้ฟอนต์จากกล่องแม่ */
}

/* รูปแบบข้อความหรือองค์ประกอบพื้นฐาน */
button {
  cursor: pointer; /* ลักษณะตัวชี้เมาส์ เช่น pointer=กดได้, not-allowed=ใช้งานไม่ได้ */
}

/* รูปแบบข้อความหรือองค์ประกอบพื้นฐาน; แสดงตำแหน่งโฟกัสเมื่อใช้คีย์บอร์ด */
button:focus-visible,a:focus-visible {
  outline: 3px solid #ed98d2; /* เส้นเน้นด้านนอกโดยไม่กินพื้นที่เลย์เอาต์ */
  outline-offset: 3px; /* ระยะเส้น outline จากกรอบ; ค่าติดลบย้ายเข้าในกรอบ */
}

/* รูปแบบข้อความหรือองค์ประกอบพื้นฐาน */
button {
  border: 0; /* เส้นขอบ: ความหนา รูปแบบ และสี; 0 คือไม่มีเส้นขอบ */
  background: none; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: inherit; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
}

/* รูปแบบข้อความหรือองค์ประกอบพื้นฐาน */
h1,h2,h3,p {
  margin: 0; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
}

/* รูปแบบข้อความหรือองค์ประกอบพื้นฐาน */
h1 {
  font-size: 25px; /* ขนาดตัวอักษร */
  line-height: 1.3; /* ความสูงบรรทัด; ค่าที่ไม่มีหน่วยเป็นตัวคูณขนาดฟอนต์ */
}

/* รูปแบบข้อความหรือองค์ประกอบพื้นฐาน */
h2 {
  font-size: 21px; /* ขนาดตัวอักษร */
  line-height: 1.4; /* ความสูงบรรทัด; ค่าที่ไม่มีหน่วยเป็นตัวคูณขนาดฟอนต์ */
}

/* รูปแบบข้อความหรือองค์ประกอบพื้นฐาน */
h3 {
  font-size: 17px; /* ขนาดตัวอักษร */
  line-height: 1.4; /* ความสูงบรรทัด; ค่าที่ไม่มีหน่วยเป็นตัวคูณขนาดฟอนต์ */
}

/* กรอบแอพหลัก */
.app {
  max-width: 460px; /* ความกว้างสูงสุด; ช่วยจำกัดแอพให้เป็นขนาดมือถือ */
  margin: auto; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
  min-height: 100dvh; /* ความสูงขั้นต่ำ; dvh อิงพื้นที่หน้าจอที่มองเห็น */
  background: linear-gradient(145deg,#fff 10%,#fcfaff 65%,#f1e7ff); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  position: relative; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  box-shadow: 0 0 70px #45326b15; /* เงากล่อง: ระยะตามแกน X/Y ความเบลอ และสี */
}

/* แถบหัวแอพที่ติดด้านบน */
.top {
  height: 80px; /* ความสูงของกล่องหรือรูป */
  padding: 18px 20px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  align-items: center; /* จัดแนวรายการตามแกนขวางของ flex/grid */
  gap: 8px; /* ระยะห่างระหว่างรายการ flex/grid */
  background: #ffffffed; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  position: sticky; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  top: 0; /* ระยะจากขอบบน เมื่อใช้ position */
  z-index: 5; /* ลำดับซ้อนทับ; ค่าสูงแสดงอยู่ด้านหน้า */
  border-bottom: 1px solid #f6f1fc; /* เส้นขอบเฉพาะด้านล่าง */
}

/* โลโก้และชื่อแอพ */
.brand {
  font-size: 26px; /* ขนาดตัวอักษร */
  font-weight: 900; /* ความหนาตัวอักษร เช่น bold หรือ 900 */
  letter-spacing: -1px; /* ระยะห่างระหว่างตัวอักษร */
  color: var(--purple); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  align-items: center; /* จัดแนวรายการตามแกนขวางของ flex/grid */
  gap: 6px; /* ระยะห่างระหว่างรายการ flex/grid */
}

/* โลโก้และชื่อแอพ; selector หลังช่องว่างคือองค์ประกอบภายใน */
.brand small {
  display: block; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  font-size: 8px; /* ขนาดตัวอักษร */
  letter-spacing: 0; /* ระยะห่างระหว่างตัวอักษร */
  color: var(--ink); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  line-height: 1; /* ความสูงบรรทัด; ค่าที่ไม่มีหน่วยเป็นตัวคูณขนาดฟอนต์ */
}

/* สัญลักษณ์หมุดโลโก้ */
.pin {
  width: 30px; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  height: 34px; /* ความสูงของกล่องหรือรูป */
  border-radius: 50% 50% 50% 4px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  background: var(--purple); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  transform: rotate(-45deg); /* ย้าย หมุน หรือปรับขนาดการแสดงผล เช่น rotate/translateX */
  display: grid; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  place-items: center; /* จัดแนวนอนและแนวตั้งของรายการใน grid พร้อมกัน */
}

/* สัญลักษณ์หมุดโลโก้; selector หลังช่องว่างคือองค์ประกอบภายใน */
.pin span {
  transform: rotate(45deg); /* ย้าย หมุน หรือปรับขนาดการแสดงผล เช่น rotate/translateX */
  color: white; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 19px; /* ขนาดตัวอักษร */
}

/* ป้ายย่านพระนคร */
.location {
  margin-left: auto; /* ระยะห่างนอกด้านซ้าย; auto ดันไปชิดขวาเมื่ออยู่ใน flex */
  font-size: 11px; /* ขนาดตัวอักษร */
  border: 1px solid #d9c2ff; /* เส้นขอบ: ความหนา รูปแบบ และสี; 0 คือไม่มีเส้นขอบ */
  border-radius: 30px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  color: var(--purple); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  padding: 3px 9px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
}

/* ปุ่มแจ้งเตือน */
.bell {
  font-size: 22px; /* ขนาดตัวอักษร */
  position: relative; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
}

/* ปุ่มแจ้งเตือน; สร้างชิ้นส่วนตกแต่งเพิ่มโดยไม่เพิ่ม HTML */
.bell:after {
  content: ''; /* ข้อความ/สัญลักษณ์ที่สร้างเพิ่มด้วย pseudo-element เช่น :before และ :after */
  width: 6px; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  height: 6px; /* ความสูงของกล่องหรือรูป */
  border-radius: 50%; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  background: #fa6581; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  position: absolute; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  right: 5px; /* ระยะจากขอบขวา เมื่อใช้ position */
  top: 6px; /* ระยะจากขอบบน เมื่อใช้ position */
}

/* พื้นที่เนื้อหาของแต่ละหน้า (#main) เผื่อที่ด้านล่างสำหรับเมนู */
main {
  padding: 18px 18px 100px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  min-height: calc(100dvh - 80px); /* ความสูงขั้นต่ำ; dvh อิงพื้นที่หน้าจอที่มองเห็น */
}

/* เมนูล่าง */
.nav {
  position: fixed; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  bottom: 0; /* ระยะจากขอบล่าง เมื่อใช้ position */
  width: min(100%,460px); /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  background: #fffffff5; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  backdrop-filter: blur(16px); /* เอฟเฟ็กต์กับพื้นด้านหลังกล่อง เช่น blur ทำให้พื้นหลังเบลอ */
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  justify-content: space-around; /* จัดรายการตามแกนหลักของ flex/grid */
  border-top: 1px solid var(--line); /* เส้นขอบเฉพาะด้านบน */
  padding: 10px 3px max(12px,env(safe-area-inset-bottom)); /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  z-index: 8; /* ลำดับซ้อนทับ; ค่าสูงแสดงอยู่ด้านหน้า */
}

/* เมนูล่าง; selector หลังช่องว่างคือองค์ประกอบภายใน */
.nav button {
  display: grid; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  justify-items: center; /* จัดตำแหน่งรายการในแต่ละช่อง grid */
  font-size: 10px; /* ขนาดตัวอักษร */
  color: #756b8b; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  width: 20%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  gap: 1px; /* ระยะห่างระหว่างรายการ flex/grid */
}

/* เมนูล่าง; selector หลังช่องว่างคือองค์ประกอบภายใน */
.nav b {
  font-size: 23px; /* ขนาดตัวอักษร */
  font-weight: 400; /* ความหนาตัวอักษร เช่น bold หรือ 900 */
  line-height: 1.3; /* ความสูงบรรทัด; ค่าที่ไม่มีหน่วยเป็นตัวคูณขนาดฟอนต์ */
}

/* เมนูล่าง; selector หลังช่องว่างคือองค์ประกอบภายใน */
.nav .active {
  color: var(--purple); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-weight: bold; /* ความหนาตัวอักษร เช่น bold หรือ 900 */
}

/* แบนเนอร์; [รูปพื้นหลัง] รับค่าจากตัวแปร --hero ที่แต่ละหน้ากำหนด */
.hero {
  padding: 20px 18px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  border-radius: 18px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  min-height: 180px; /* ความสูงขั้นต่ำ; dvh อิงพื้นที่หน้าจอที่มองเห็น */
  background: linear-gradient(90deg,#eadbfb 5%,#f7e3ecbb 53%,#ffffff00),var(--hero) center/cover; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  position: relative; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  overflow: hidden; /* ส่วนที่ล้นกรอบ: hidden/clip=ตัด, auto=เลื่อนได้เมื่อเนื้อหาล้น */
}

/* แบนเนอร์; [รูปพื้นหลัง] รับค่าจากตัวแปร --hero ที่แต่ละหน้ากำหนด; selector หลังช่องว่างคือองค์ประกอบภายใน */
.hero h1 {
  font-size: 24px; /* ขนาดตัวอักษร */
  max-width: 230px; /* ความกว้างสูงสุด; ช่วยจำกัดแอพให้เป็นขนาดมือถือ */
  margin: 6px 0; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
}

/* แบนเนอร์; [รูปพื้นหลัง] รับค่าจากตัวแปร --hero ที่แต่ละหน้ากำหนด; selector หลังช่องว่างคือองค์ประกอบภายใน */
.hero p {
  font-size: 12px; /* ขนาดตัวอักษร */
  max-width: 215px; /* ความกว้างสูงสุด; ช่วยจำกัดแอพให้เป็นขนาดมือถือ */
  line-height: 1.5; /* ความสูงบรรทัด; ค่าที่ไม่มีหน่วยเป็นตัวคูณขนาดฟอนต์ */
}

/* ป้ายคำสั้นบนแบนเนอร์ */
.pill {
  display: inline-block; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  border-radius: 20px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  padding: 3px 9px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  background: white; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: var(--purple); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 10px; /* ขนาดตัวอักษร */
  font-weight: bold; /* ความหนาตัวอักษร เช่น bold หรือ 900 */
}

/* ปุ่มหลักสีม่วง */
.primary {
  display: block; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  background: linear-gradient(110deg,#ae62ff,#6419df); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: white; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  border-radius: 25px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  padding: 11px 20px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  font-weight: bold; /* ความหนาตัวอักษร เช่น bold หรือ 900 */
  box-shadow: 0 4px 9px #853cff25; /* เงากล่อง: ระยะตามแกน X/Y ความเบลอ และสี */
  text-align: center; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
  width: 100%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
}

/* ปุ่มหลักสีม่วง; ใช้เมื่อปุ่มถูกปิดใช้งาน */
.primary:disabled {
  opacity: .4; /* ความทึบ: 0=โปร่งใส, 1=ทึบเต็มที่ */
  cursor: not-allowed; /* ลักษณะตัวชี้เมาส์ เช่น pointer=กดได้, not-allowed=ใช้งานไม่ได้ */
}

/* แบนเนอร์; [รูปพื้นหลัง] รับค่าจากตัวแปร --hero ที่แต่ละหน้ากำหนด; selector หลังช่องว่างคือองค์ประกอบภายใน */
.hero .primary {
  width: auto; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  padding: 7px 20px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  margin-top: 12px; /* ระยะห่างนอกด้านบน */
}

/* หัวข้อหมวดและลิงก์ */
.section {
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  align-items: center; /* จัดแนวรายการตามแกนขวางของ flex/grid */
  justify-content: space-between; /* จัดรายการตามแกนหลักของ flex/grid */
  margin: 22px 0 11px; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
}

/* ปุ่มแบบข้อความ */
.link {
  color: var(--purple); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 12px; /* ขนาดตัวอักษร */
}

/* กริดแพ็กเกจ */
.packages {
  display: grid; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  grid-template-columns: repeat(3,1fr); /* กำหนดจำนวนและสัดส่วนคอลัมน์; 1fr คือส่วนแบ่งพื้นที่ */
  gap: 7px; /* ระยะห่างระหว่างรายการ flex/grid */
}

/* การ์ดแพ็กเกจ */
.package {
  padding: 5px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  background: #f2eaff; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  border: 1px solid #e9dcff; /* เส้นขอบ: ความหนา รูปแบบ และสี; 0 คือไม่มีเส้นขอบ */
  border-radius: 14px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  overflow: hidden; /* ส่วนที่ล้นกรอบ: hidden/clip=ตัด, auto=เลื่อนได้เมื่อเนื้อหาล้น */
}

/* การ์ดแพ็กเกจ; [รูปภาพ] กำหนดขนาด/การครอบของแท็ก img */
.package img {
  width: 100%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  height: 86px; /* ความสูงของกล่องหรือรูป */
  object-fit: cover; /* [รูปภาพ] cover ครอบให้เต็มกรอบโดยคงสัดส่วน; อาจตัดขอบรูปบางส่วน */
  border-radius: 10px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
}

/* การ์ดแพ็กเกจ; selector หลังช่องว่างคือองค์ประกอบภายใน */
.package h3 {
  font-size: 14px; /* ขนาดตัวอักษร */
  margin-top: 4px; /* ระยะห่างนอกด้านบน */
}

/* การ์ดแพ็กเกจ; selector หลังช่องว่างคือองค์ประกอบภายใน */
.package p {
  font-size: 9px; /* ขนาดตัวอักษร */
  min-height: 25px; /* ความสูงขั้นต่ำ; dvh อิงพื้นที่หน้าจอที่มองเห็น */
}

/* ราคา */
.price {
  font-size: 23px; /* ขนาดตัวอักษร */
  color: var(--tone,var(--purple)); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-weight: 900; /* ความหนาตัวอักษร เช่น bold หรือ 900 */
  line-height: 1.5; /* ความสูงบรรทัด; ค่าที่ไม่มีหน่วยเป็นตัวคูณขนาดฟอนต์ */
}

/* ราคา; selector หลังช่องว่างคือองค์ประกอบภายใน */
.price small {
  color: var(--ink); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 9px; /* ขนาดตัวอักษร */
  font-weight: 400; /* ความหนาตัวอักษร เช่น bold หรือ 900 */
}

/* รายการสิทธิประโยชน์ */
.features {
  list-style: none; /* รูปแบบเครื่องหมายรายการ; none ซ่อนจุดนำหน้า */
  margin: 5px 0; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
  padding: 0; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  font-size: 9px; /* ขนาดตัวอักษร */
  line-height: 1.9; /* ความสูงบรรทัด; ค่าที่ไม่มีหน่วยเป็นตัวคูณขนาดฟอนต์ */
}

/* รายการสิทธิประโยชน์; สร้างชิ้นส่วนตกแต่งเพิ่มโดยไม่เพิ่ม HTML */
.features li:before {
  content: '✓'; /* ข้อความ/สัญลักษณ์ที่สร้างเพิ่มด้วย pseudo-element เช่น :before และ :after */
  border-radius: 50%; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  background: var(--tone,var(--purple)); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: white; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  margin-right: 3px; /* ระยะห่างนอกด้านขวา */
  padding: 0 2px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
}

/* ปุ่มเลือกแพ็กเกจ */
.choose {
  width: 100%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  padding: 7px 3px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  border-radius: 20px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  background: var(--tint,#e6d5ff); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: var(--tone,var(--purple)); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 10px; /* ขนาดตัวอักษร */
  font-weight: bold; /* ความหนาตัวอักษร เช่น bold หรือ 900 */
}

/* กริดซีรีส์/รูปสถานที่ */
.series-grid {
  display: grid; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  grid-template-columns: 1fr 1fr; /* กำหนดจำนวนและสัดส่วนคอลัมน์; 1fr คือส่วนแบ่งพื้นที่ */
  gap: 13px; /* ระยะห่างระหว่างรายการ flex/grid */
}

/* การ์ดซีรีส์ */
.series-card {
  padding: 0; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  text-align: left; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
  border: 1px solid var(--line); /* เส้นขอบ: ความหนา รูปแบบ และสี; 0 คือไม่มีเส้นขอบ */
  border-radius: 15px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  overflow: hidden; /* ส่วนที่ล้นกรอบ: hidden/clip=ตัด, auto=เลื่อนได้เมื่อเนื้อหาล้น */
  background: white; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  box-shadow: 0 2px 3px #2f164b08; /* เงากล่อง: ระยะตามแกน X/Y ความเบลอ และสี */
}

/* [รูปภาพ] กรอบโปสเตอร์ */
.poster {
  height: 150px; /* ความสูงของกล่องหรือรูป */
  position: relative; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
}

/* [รูปภาพ] กรอบโปสเตอร์; [รูปภาพ] กำหนดขนาด/การครอบของแท็ก img */
.poster img {
  width: 100%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  height: 100%; /* ความสูงของกล่องหรือรูป */
  object-fit: cover; /* [รูปภาพ] cover ครอบให้เต็มกรอบโดยคงสัดส่วน; อาจตัดขอบรูปบางส่วน */
}

/* [รูปภาพ] กรอบโปสเตอร์; selector หลังช่องว่างคือองค์ประกอบภายใน */
.poster strong {
  position: absolute; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  bottom: 0; /* ระยะจากขอบล่าง เมื่อใช้ position */
  left: 0; /* ระยะจากขอบซ้าย เมื่อใช้ position */
  right: 0; /* ระยะจากขอบขวา เมื่อใช้ position */
  padding: 25px 12px 8px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  background: linear-gradient(transparent,#160e26c9); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: white; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 21px; /* ขนาดตัวอักษร */
}

/* การ์ดซีรีส์; selector หลังช่องว่างคือองค์ประกอบภายใน */
.series-card small {
  display: block; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  padding: 9px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  font-size: 10px; /* ขนาดตัวอักษร */
}

/* แถบรายการแนวนอน */
.strip {
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  gap: 8px; /* ระยะห่างระหว่างรายการ flex/grid */
  overflow: auto; /* ส่วนที่ล้นกรอบ: hidden/clip=ตัด, auto=เลื่อนได้เมื่อเนื้อหาล้น */
}

/* ตัวเลือกชำระเงิน */

}

}

/* แถบขั้นตอน */
.steps {
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  justify-content: space-between; /* จัดรายการตามแกนหลักของ flex/grid */
  margin: 20px 0 25px; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
  position: relative; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
}

/* แถบขั้นตอน; สร้างชิ้นส่วนตกแต่งเพิ่มโดยไม่เพิ่ม HTML */
.steps:before {
  content: ''; /* ข้อความ/สัญลักษณ์ที่สร้างเพิ่มด้วย pseudo-element เช่น :before และ :after */
  height: 2px; /* ความสูงของกล่องหรือรูป */
  background: #dfd1ef; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  position: absolute; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  top: 15px; /* ระยะจากขอบบน เมื่อใช้ position */
  left: 35px; /* ระยะจากขอบซ้าย เมื่อใช้ position */
  right: 35px; /* ระยะจากขอบขวา เมื่อใช้ position */
}

  text-align: center; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
  width: 33%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  font-size: 10px; /* ขนาดตัวอักษร */

}

  background: #e3d9ee; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */

/* ขั้นตอนแต่ละขั้น; selector หลังช่องว่างคือองค์ประกอบภายใน */

/* กริดตัวเลือกทริป; selector หลังช่องว่างคือองค์ประกอบภายใน */

}

/* รายการเส้นทาง */
.timeline {

}

/* สถานที่หนึ่งจุด */
.stop {
  position: relative; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  gap: 12px; /* ระยะห่างระหว่างรายการ flex/grid */
  padding: 10px 0 10px 30px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
}

/* สถานที่หนึ่งจุด; สร้างชิ้นส่วนตกแต่งเพิ่มโดยไม่เพิ่ม HTML */
.stop:before {
  content: ''; /* ข้อความ/สัญลักษณ์ที่สร้างเพิ่มด้วย pseudo-element เช่น :before และ :after */
  position: absolute; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  left: 11px; /* ระยะจากขอบซ้าย เมื่อใช้ position */
  top: 0; /* ระยะจากขอบบน เมื่อใช้ position */
  bottom: 0; /* ระยะจากขอบล่าง เมื่อใช้ position */
  width: 2px; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  background: #b98aff; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
}

/* สถานที่หนึ่งจุด; selector หลังช่องว่างคือองค์ประกอบภายใน */
.stop b.number {

  left: 0; /* ระยะจากขอบซ้าย เมื่อใช้ position */
  top: 20px; /* ระยะจากขอบบน เมื่อใช้ position */
  border-radius: 50%; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  background: var(--purple); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: white; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  width: 24px; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */

  text-align: center; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
  z-index: 1; /* ลำดับซ้อนทับ; ค่าสูงแสดงอยู่ด้านหน้า */
}

/* สถานที่หนึ่งจุด; [รูปภาพ] กำหนดขนาด/การครอบของแท็ก img */

}

/* สถานที่หนึ่งจุด; selector หลังช่องว่างคือองค์ประกอบภายใน */
.stop small {

}

/* หน้าสถานะว่าง */

}

/* หน้าสถานะว่าง; selector หลังช่องว่างคือองค์ประกอบภายใน */
.empty .symbol {
  font-size: 70px; /* ขนาดตัวอักษร */
  color: #ab7aff; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
}

/* หน้าสถานะว่าง; selector หลังช่องว่างคือองค์ประกอบภายใน */

/* แท็บ */

}

/* แท็บ; selector หลังช่องว่างคือองค์ประกอบภายใน */
.tabs button {
  border-radius: 20px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */

  background: #eee4fb; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: var(--purple); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 12px; /* ขนาดตัวอักษร */
}

/* แท็บ; selector หลังช่องว่างคือองค์ประกอบภายใน */
.tabs .active {
  background: var(--purple); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: white; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
}

/* พื้นแผนที่จำลองและ SVG */
.map {
  height: 170px; /* ความสูงของกล่องหรือรูป */
  background: repeating-linear-gradient(40deg,transparent 0 26px,#fff 27px 34px),repeating-linear-gradient(140deg,#e9e8e9 0 35px,#fafafa 36px 44px); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  border-radius: 12px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  display: grid; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  place-items: center; /* จัดแนวนอนและแนวตั้งของรายการใน grid พร้อมกัน */
  position: relative; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  overflow: hidden; /* ส่วนที่ล้นกรอบ: hidden/clip=ตัด, auto=เลื่อนได้เมื่อเนื้อหาล้น */
}

/* พื้นแผนที่จำลองและ SVG; selector หลังช่องว่างคือองค์ประกอบภายใน */
.map svg {
  width: 85%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  height: 85%; /* ความสูงของกล่องหรือรูป */
}

/* ป้ายสถานะ */
.badge {
  display: inline-block; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  font-size: 10px; /* ขนาดตัวอักษร */
  color: var(--purple); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  background: #efe2ff; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */

  padding: 3px 10px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
}

/* แถบความคืบหน้า */

  margin: 15px 0; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
  overflow: hidden; /* ส่วนที่ล้นกรอบ: hidden/clip=ตัด, auto=เลื่อนได้เมื่อเนื้อหาล้น */
}

/* แถบความคืบหน้า; selector หลังช่องว่างคือองค์ประกอบภายใน */

.menu-item {
  width: 100%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  justify-content: space-between; /* จัดรายการตามแกนหลักของ flex/grid */
  padding: 14px 4px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  border-bottom: 1px solid var(--line); /* เส้นขอบเฉพาะด้านล่าง */
  text-align: left; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
}

/* ข้อความแจ้งเตือนชั่วคราว */
.toast {
  position: fixed; /* วิธีวางตำแหน่ง: relative=จุดอ้างอิง, absolute=อิงกล่องแม่, fixed=ติดจอ, sticky=เลื่อนแล้วติดขอบ */
  bottom: 90px; /* ระยะจากขอบล่าง เมื่อใช้ position */
  left: 50%; /* ระยะจากขอบซ้าย เมื่อใช้ position */
  transform: translateX(-50%); /* ย้าย หมุน หรือปรับขนาดการแสดงผล เช่น rotate/translateX */
  background: #251541ed; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: white; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  border-radius: 18px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  padding: 12px 20px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  font-size: 12px; /* ขนาดตัวอักษร */
  z-index: 30; /* ลำดับซ้อนทับ; ค่าสูงแสดงอยู่ด้านหน้า */
  width: max-content; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  max-width: 90vw; /* ความกว้างสูงสุด; ช่วยจำกัดแอพให้เป็นขนาดมือถือ */
}

/* ข้อความแจ้งต้นแบบ */
.notice {
  padding: 9px 12px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  border-radius: 10px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  background: #f0e5ff; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: #7752a0; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 10px; /* ขนาดตัวอักษร */
  margin: 12px 0; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
}

/* บัตรตราประทับ */
.ticket {
  text-align: center; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
  background: linear-gradient(140deg,#e8d6ff,#fff); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  padding: 25px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  border: 2px dashed #b28bdf; /* เส้นขอบ: ความหนา รูปแบบ และสี; 0 คือไม่มีเส้นขอบ */
  border-radius: 18px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  margin: 20px 0; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
}

/* บัตรตราประทับ; [รูปภาพ] กำหนดขนาด/การครอบของแท็ก img */
.ticket img {
  width: 100%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  height: 160px; /* ความสูงของกล่องหรือรูป */
  object-fit: cover; /* [รูปภาพ] cover ครอบให้เต็มกรอบโดยคงสัดส่วน; อาจตัดขอบรูปบางส่วน */
  border-radius: 12px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
}

/* ข้อความท้ายหน้า */
.footnote {
  text-align: center; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
  color: #a197ac; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 10px; /* ขนาดตัวอักษร */
  margin-top: 22px; /* ระยะห่างนอกด้านบน */
}

/* #ปรับหน้าตาสำหรับหน้าจอกว้างตั้งแต่ 600px */
@media(min-width:600px) {
  /* พื้นหน้าเว็บและฟอนต์เริ่มต้น */
  body {
    padding: 25px 0; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  }

  /* กรอบแอพหลัก */
  .app {
    border-radius: 28px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
    overflow: clip; /* ส่วนที่ล้นกรอบ: hidden/clip=ตัด, auto=เลื่อนได้เมื่อเนื้อหาล้น */
    min-height: calc(100dvh - 50px); /* ความสูงขั้นต่ำ; dvh อิงพื้นที่หน้าจอที่มองเห็น */
  }

  /* เมนูล่าง */
  .nav {
    bottom: 25px; /* ระยะจากขอบล่าง เมื่อใช้ position */
    border-radius: 0 0 28px 28px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  }

  /* แถบหัวแอพที่ติดด้านบน */
  .top {
    top: 0; /* ระยะจากขอบบน เมื่อใช้ position */
  }

  /* พื้นที่เนื้อหาของแต่ละหน้า (#main) เผื่อที่ด้านล่างสำหรับเมนู */
  main {
    min-height: 760px; /* ความสูงขั้นต่ำ; dvh อิงพื้นที่หน้าจอที่มองเห็น */
  }
}

/* หัวข้อคูปอง */
.coupon-banner {
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  align-items: center; /* จัดแนวรายการตามแกนขวางของ flex/grid */
  gap: 14px; /* ระยะห่างระหว่างรายการ flex/grid */
  padding: 20px 4px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
}

/* ไอคอนคูปอง */
.coupon-icon {
  font-size: 44px; /* ขนาดตัวอักษร */
  filter: drop-shadow(0 6px 5px #803bff25); /* เอฟเฟ็กต์กับตัวกล่อง เช่น drop-shadow เพิ่มเงาตามรูปร่าง */
}

/* หัวข้อคูปอง; selector หลังช่องว่างคือองค์ประกอบภายใน */
.coupon-banner h2 {
  font-size: 20px; /* ขนาดตัวอักษร */
}

/* จำนวนสิทธิ์ */
.coupon-count {
  margin-left: auto; /* ระยะห่างนอกด้านซ้าย; auto ดันไปชิดขวาเมื่ออยู่ใน flex */
  white-space: nowrap; /* วิธีตัดบรรทัดของข้อความ; nowrap ห้ามขึ้นบรรทัดใหม่ */
  background: var(--purple); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  color: white; /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  border-radius: 20px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  padding: 3px 12px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
}

/* ปุ่มเลือกประเภทคูปอง */
.coupon-option {
  width: 100%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  text-align: left; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  align-items: center; /* จัดแนวรายการตามแกนขวางของ flex/grid */
  gap: 14px; /* ระยะห่างระหว่างรายการ flex/grid */
  background: #f4eaff; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  border: 1px solid #e1d0fa; /* เส้นขอบ: ความหนา รูปแบบ และสี; 0 คือไม่มีเส้นขอบ */
  border-radius: 20px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  padding: 20px 16px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  margin: 12px 0; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
  box-shadow: 0 4px 0 #d9c3ef55; /* เงากล่อง: ระยะตามแกน X/Y ความเบลอ และสี */
}

/* ปุ่มเลือกประเภทคูปอง */
.coupon-option>span:first-child {
  font-size: 30px; /* ขนาดตัวอักษร */
}

/* ปุ่มเลือกประเภทคูปอง; selector หลังช่องว่างคือองค์ประกอบภายใน */
.coupon-option small {
  display: block; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  color: var(--muted); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
}

/* ปุ่มเลือกประเภทคูปอง */
.coupon-option>span:last-child {
  margin-left: auto; /* ระยะห่างนอกด้านซ้าย; auto ดันไปชิดขวาเมื่ออยู่ใน flex */
  font-size: 28px; /* ขนาดตัวอักษร */
}

/* [ภาพอาหาร] อีโมจิและพื้นหลังตัวอย่าง */
.food-art {
  display: grid; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  place-items: center; /* จัดแนวนอนและแนวตั้งของรายการใน grid พร้อมกัน */
  background: radial-gradient(ellipse,#fff7dc 25%,#eed4ad 65%,#b88b61); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  font-size: 48px; /* ขนาดตัวอักษร */
  border-radius: 12px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  min-width: 80px; /* ความกว้างขั้นต่ำ เช่น ป้องกันการ์ดในแถบเลื่อนถูกบีบเล็กเกินไป */
  height: 78px; /* ความสูงของกล่องหรือรูป */
}

/* ภาพอาหารใหญ่ในหน้ารวมคูปอง */
.coupon-hero {
  margin-top: 24px; /* ระยะห่างนอกด้านบน */
  text-align: center; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
  background: linear-gradient(165deg,transparent,#d9b4f4); /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  border-radius: 50% 50% 20px 20px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  padding: 28px 10px 16px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
}

/* ภาพอาหารใหญ่ในหน้ารวมคูปอง; selector หลังช่องว่างคือองค์ประกอบภายใน */
.coupon-hero .food-art {
  height: 170px; /* ความสูงของกล่องหรือรูป */
  font-size: 115px; /* ขนาดตัวอักษร */
  background: transparent; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
}

/* การ์ดร้านอาหาร */
.coupon-row {
  display: flex; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  align-items: center; /* จัดแนวรายการตามแกนขวางของ flex/grid */
  gap: 12px; /* ระยะห่างระหว่างรายการ flex/grid */
  width: 100%; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  text-align: left; /* จัดแนวข้อความ ซ้าย/กลาง/ขวา */
  border: 1px solid #e0ccef; /* เส้นขอบ: ความหนา รูปแบบ และสี; 0 คือไม่มีเส้นขอบ */
  border-radius: 16px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  background: #fcf8ff; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  padding: 8px; /* พื้นที่ว่างภายในกรอบ; ค่าตามลำดับบน ขวา ล่าง ซ้าย หรือแบบย่อ */
  margin: 10px 0; /* ระยะห่างนอกกรอบ; 1 ค่า=ทุกด้าน, 2 ค่า=บนล่าง/ซ้ายขวา, auto ใช้จัดกลาง */
}

/* การ์ดร้านอาหาร; :has(input:checked) เลือกการ์ดที่มี radio ถูกเลือก */
.coupon-row:has(input:checked) {
  border: 2px solid var(--purple); /* เส้นขอบ: ความหนา รูปแบบ และสี; 0 คือไม่มีเส้นขอบ */
  background: #f0e3ff; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
}

/* การ์ดร้านอาหาร; selector หลังช่องว่างคือองค์ประกอบภายใน */
.coupon-row .coupon-copy {
  flex: 1; /* สัดส่วนขยาย/หดของรายการใน flex */
}

/* การ์ดร้านอาหาร; selector หลังช่องว่างคือองค์ประกอบภายใน */
.coupon-row h3 {
  font-size: 15px; /* ขนาดตัวอักษร */
}

/* การ์ดร้านอาหาร; selector หลังช่องว่างคือองค์ประกอบภายใน */
.coupon-row small {
  display: block; /* รูปแบบจัดวาง: flex=เรียงยืดหยุ่น, grid=ตาราง, block=เต็มบรรทัด, inline-block=กล่องในบรรทัด */
  color: var(--muted); /* สีข้อความ; var(...) อ่านค่าตัวแปร CSS */
  font-size: 11px; /* ขนาดตัวอักษร */
}

/* การ์ดร้านอาหาร; selector หลังช่องว่างคือองค์ประกอบภายใน */
.coupon-row input {
  accent-color: var(--purple); /* สีตัวเลือกของ input เช่น radio/checkbox */
  width: 18px; /* ความกว้าง; % อิงกล่องแม่ และ min(...) เลือกค่าที่เล็กกว่า */
  height: 18px; /* ความสูงของกล่องหรือรูป */
}

/* บัตรคูปอง */
.coupon-ticket {
  background: #fff; /* สี/ไล่สี/รูปพื้นหลัง; ค่า url(...) คือแหล่งรูป และ cover ใช้ครอบเต็มกรอบ */
  border-radius: 20px; /* ความโค้งมุม; 50% ใช้ทำวงกลมหรือวงรี */
  overflow: hidden; /* ส่วนที่ล้นกรอบ: hidden/clip=ตัด, auto=เลื่อนได้เมื่อเนื้อหาล้น */

แจ้งข้อความชั่วคราว: t คือข้อความ ล้างข้อความเดิม สร้างกล่องใหม่ และลบหลัง 3 วินาที */
function toast(t) {
  // แทนเนื้อหา HTML ของกล่องที่เลือก
  $('#live').innerHTML = '';
  /* สร้าง div ใหม่สำหรับแสดงข้อความแจ้งเตือน */
  const el = document.createElement('div');
  // กำหนดคลาสสำหรับตกแต่งด้วย CSS
  el.className = 'toast';
  // ใส่ข้อความแบบข้อความล้วน
  el.textContent = t;
  // เพิ่มกล่องแจ้งเตือนเข้า #live เพื่อให้มองเห็นและให้โปรแกรมอ่านหน้าจอแจ้งได้
  $('#live').append(el);
  // ลบข้อความแจ้งเตือนหลัง 3000 มิลลิวินาที (3 วินาที)
  setTimeout(() => el.remove(), 3000);
}
/* #go
เปลี่ยนหน้า: p คือรหัสหน้า กำหนด page เรียก render() แล้วเลื่อนกลับด้านบน */
function go(p) {
  // เก็บรหัสหน้าที่จะเปิด
  page = p;
  // วาดหน้าจอด้วยสถานะปัจจุบัน
  render();
  // เลื่อนหน้าจอกลับด้านบนหลังเปลี่ยนหน้า
  window.scrollTo(0, 0);
}

/* #couponBarcode
วาดบาร์โค้ดสาธิตจาก code ด้วยแท่ง SVG; ไม่ใช่บาร์โค้ดมาตรฐานสำหรับแลกสิทธิ์จริง */
function couponBarcode(code) {
  /* ข้อความเลขฐานสองสำหรับวาดแท่งบาร์โค้ดสาธิต เริ่มด้วยรูปแบบคงที่ */
  let bits = '11010010000';
  // วนทีละอักขระใน code แปลงเป็นฐานสอง 8 หลัก แล้วเติมตัวคั่น
  for (const ch of code) {
    // ต่อข้อความฐานสองที่ใช้วาดแท่งบาร์โค้ด
    bits += ch.charCodeAt(0).toString(2).padStart(8, '0') + '0';
  }
  // ต่อข้อความฐานสองที่ใช้วาดแท่งบาร์โค้ด
  bits += '1100011101011';
  // คืน HTML หรือผลลัพธ์ให้ส่วนที่เรียกใช้
  return (
    // ภาพวาดเวกเตอร์
    `<svg class="coupon-barcode" viewBox="0 0 ${bits.length + 20} 60" role="img" aria-label="บาร์โค้ดตัวอย่าง ใช้แลกจริงไม่ได้" preserveAspectRatio="none">`
  ) +
  // สี่เหลี่ยม SVG สำหรับแท่งบาร์โค้ด
  `<rect width="100%" height="100%" fill="white"/>${[...bits].map((b, i) => b === '1' ? `<rect x="${i + 10}" y="4" width="1" height="48" fill="#20134d"/>` : '').join('')}</svg>`;
}

function toggleShow(i) {

  if (selected.includes(name)) {

    selected.push(name);

  render();
}

function render() {
  /* เรียกฟังก์ชันของหน้าปัจจุบันเพื่อรับ HTML แล้วแสดงใน #main */
  let h = pageViews[page] ? pageViews[page]() : "";

  $('#main').innerHTML = h;
  // จัดขนาดรูปที่อยู่โดยตรงในกริด/รายการจุดหมายให้พอดีกรอบ
  document.querySelectorAll('#main .series-grid>img,#main .strip>div>img').forEach(el => {
    // กำหนดขนาดรูปและการครอบภาพ
    el.style.cssText = 'width:100%;height:100px;object-fit:cover;border-radius:12px';

  /* กำหนดเมนูล่างที่เน้น: หน้าหลัก/ซีรีส์/ทริป/ชุมชน/โปรไฟล์; หน้าย่อยจัดตามเงื่อนไขเดิม */
  const active = ['home', 'series', 'trips', 'community', 'profile'].includes(page) ? page : ['packages', 'checkout', 'success'].includes(page) ? 'home' : ['detail'].includes(page) ? 'series' : 'trips';
  // แทนเนื้อหา HTML ของกล่องที่เลือก

  // ปุ่ม: onclick ระบุคำสั่งเมื่อคลิก
  `<button class="${p === active ? 'active' : ''}" ${p === active ? 'aria-current="page"' : ''} onclick="go('${p}')">` +
  // ข้อความตัวหนา
  `<b>${icon}</b>${label}</button>`).join('');

  รูปแบนเนอร์: A.temple; รูปแต่ละเรื่อง: shows[].img ผ่าน seriesCard() */

      let q = e.target.value.toLowerCase();
      // แทนเนื้อหา HTML ของกล่องที่เลือก
      $('#results').innerHTML = shows.map((s, i) => s.name.toLowerCase().includes(q) ? seriesCard(s, i) : '').join('') || '<p class="muted">ไม่พบซีรีส์ที่ค้นหา</p>';
    });
  }
}
if (state.pack !== null) {
  // กำหนดลำดับแพ็กเกจที่เลือก
  picked = state.pack;
}
// วาดหน้าจอด้วยสถานะปัจจุบัน
render();
</script>
</body>
</html>
